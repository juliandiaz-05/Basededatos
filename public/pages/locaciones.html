<section class="view">
  <header class="view-head">
    <div>
      <h2>Locaciones</h2>
      <p>Espacios físicos de rodaje con su país y costo diario.</p>
    </div>
    <button class="btn btn-primary" data-new="locaciones">+ Nueva locación</button>
  </header>
  <div class="card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>País</th>
            <th>Costo diario</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-locaciones"></tbody>
      </table>
    </div>
  </div>
</section>
