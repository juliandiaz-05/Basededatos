<section class="view">
  <header class="view-head">
    <div>
      <h2>Plan de Rodaje</h2>
      <p>Cronograma de rodaje de las escenas. Gestione cancelaciones por clima y reprogramaciones.</p>
    </div>
    <button class="btn btn-primary" data-new="plan">+ Programar rodaje</button>
  </header>
  <div class="card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Producción</th>
            <th>Escena</th>
            <th>Ambiente</th>
            <th>Clima</th>
            <th>Locación</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-plan"></tbody>
      </table>
    </div>
  </div>
</section>
