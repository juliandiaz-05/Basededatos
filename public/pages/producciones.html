<section class="view">
  <header class="view-head">
    <div>
      <h2>Producciones</h2>
      <p>Registre y supervise las producciones cinematográficas, sus presupuestos y estados.</p>
    </div>
    <button class="btn btn-primary" data-new="producciones">+ Nueva producción</button>
  </header>
  <div class="card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Estado</th>
            <th>Presupuesto</th>
            <th>Costo locaciones</th>
            <th>Escenas</th>
            <th>Rodajes</th>
            <th>Alertas</th>
            <th>Periodo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-producciones"></tbody>
      </table>
    </div>
  </div>
</section>
